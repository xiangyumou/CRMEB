# The `edge` server block. Ported from deploy/production/nginx.conf, with the
# FastCGI half replaced by a proxy to the Next standalone server.
#
# Three surfaces behind one port:
#   /                the uni-app H5 build, a history-mode SPA
#   /admin, /admin-api, /api    the `web` container
#   /uploads/        the shared volume, as inert bytes

upstream web {
    server web:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /srv/h5;
    index index.html;
    charset utf-8;

    # Matches the application's own upload ceiling. Nginx answers 413 before a
    # byte reaches the app, so the two limits have to agree or the larger one
    # is a lie. Keep in step with `NEXT_MAX_UPLOAD_SIZE` in compose.yml.
    client_max_body_size 100M;

    server_tokens off;
    # The uploads location re-states these; `add_header` does not inherit into
    # a block that sets one of its own.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- probes -------------------------------------------------------------

    # Liveness of the edge itself. Deliberately answered by nginx: it must not
    # depend on the app, or a slow app would take the edge's own probe down
    # with it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness of what is behind the edge. Today this proves the Next server
    # is serving; the deep check (schema, Redis, the worker heartbeat) is
    # `deploy/next/lib/readiness.sh`, which is what upgrade.sh gates on.
    #
    # CR-1-j2 asks for a real `/readyz` route in `apps/web`. When it lands this
    # becomes a one-line change: `proxy_pass http://web/readyz;`.
    location = /readyz {
        proxy_pass http://web/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # --- the application ----------------------------------------------------

    # Server-sent events. Buffering an SSE stream holds every event until the
    # buffer fills, which looks exactly like "notifications stopped working";
    # the long read timeout keeps nginx from cutting an idle stream.
    location = /admin-api/notifications/stream {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(admin|admin-api|api)(/|$) {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Next's own build assets are immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # --- uploads ------------------------------------------------------------

    # Static bytes, never code. `^~` wins over every regex location below, so
    # the dotfile deny and the nosniff header are restated here rather than
    # inherited — the old stack learned that the hard way (see the Chinese note
    # in deploy/production/nginx.conf).
    #
    # The new uploader sniffs content and refuses scripts, HTML and SVG
    # (STOR-001), so this is defence in depth rather than the only guard it was
    # in the old stack. It stays because depth is the point.
    location ^~ /uploads/ {
        alias /data/uploads/;

        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(ph(p[3457]?|t|tml|ar)|jsp?|aspx?|cgi|pl|py|sh|so|exe|html?|xhtml|svgz?)$ { deny all; }

        # Known media types keep their real type; everything else is bytes, not
        # a guess. The `^~` prefix means nothing here is inherited, so the
        # header set is written out in full rather than assumed.
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        # An image served as `text/html` because a browser guessed is a stored
        # XSS on our own origin.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=604800" always;

        try_files $uri =404;
        access_log off;
    }

    # --- the H5 storefront --------------------------------------------------

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* "\.[a-f0-9]{8,}\.(js|css|woff2?|ttf|svg|jpe?g|png|webp)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # History-mode fallback, last so every rule above wins over it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
    }
}
