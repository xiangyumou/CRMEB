packages:
  - apps/*
  - packages/*
  - e2e/*
  - guards
# pnpm 12 refuses to install while any dependency's build script is undecided.
# Everything below `false` is an OPTIONAL native accelerator with a working pure-JS
# fallback, so we skip the compile rather than add a toolchain to CI and to the
# 2-core production box. See docs/rewrite/cr/CR-1-p0a.md.
allowBuilds:
  cpu-features: false # optional CPU detection for ssh2 (testcontainers -> docker-modem)
  esbuild: true
  msgpackr-extract: false # optional msgpack accelerator for bullmq
  protobufjs: false # postinstall only wires up its own CLI, unused here
  ssh2: false # pure-JS crypto fallback is fine; only used to talk to a remote docker host
  unrs-resolver: true # native binding of eslint-import-resolver-typescript
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.103.2'
  - '@tanstack/react-query@5.103.2'
