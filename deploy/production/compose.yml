name: crmeb-production

services:
  mysql:
    image: mysql:8.0.42
    container_name: crmeb-mysql
    restart: unless-stopped
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    volumes:
      - ${CRMEB_DATA_DIR:?}/mysql:/var/lib/mysql
    networks:
      - server-internal-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:5.0.14-bullseye
    container_name: crmeb-redis
    restart: unless-stopped
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ${CRMEB_DATA_DIR:?}/redis:/data
    networks:
      - server-internal-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    image: ${CRMEB_IMAGE:?}
    container_name: crmeb-php
    restart: unless-stopped
    command: ["php"]
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    environment:
      TZ: Asia/Shanghai
      APP_URL: https://${CRMEB_HOST:?}
    volumes:
      - ${CRMEB_CONFIG_DIR:?}/.env:/var/www/crmeb/.env:ro
      - ${CRMEB_CONFIG_DIR:?}/.constant:/var/www/crmeb/.constant
      - ${CRMEB_DATA_DIR:?}/uploads:/var/www/crmeb/public/uploads
      - ${CRMEB_DATA_DIR:?}/runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - server-internal-net
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options: {max-size: "10m", max-file: "3"}

  queue:
    image: ${CRMEB_IMAGE:?}
    container_name: crmeb-queue
    restart: unless-stopped
    command: ["queue"]
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    volumes:
      - ${CRMEB_CONFIG_DIR:?}/.env:/var/www/crmeb/.env:ro
      - ${CRMEB_CONFIG_DIR:?}/.constant:/var/www/crmeb/.constant
      - ${CRMEB_DATA_DIR:?}/uploads:/var/www/crmeb/public/uploads
      - ${CRMEB_DATA_DIR:?}/runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - server-internal-net
    logging:
      options: {max-size: "10m", max-file: "3"}

  timer:
    image: ${CRMEB_IMAGE:?}
    container_name: crmeb-timer
    restart: unless-stopped
    command: ["timer"]
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    volumes:
      - ${CRMEB_CONFIG_DIR:?}/.env:/var/www/crmeb/.env:ro
      - ${CRMEB_CONFIG_DIR:?}/.constant:/var/www/crmeb/.constant
      - ${CRMEB_DATA_DIR:?}/uploads:/var/www/crmeb/public/uploads
      - ${CRMEB_DATA_DIR:?}/runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - server-internal-net
    logging:
      options: {max-size: "10m", max-file: "3"}

  workerman:
    image: ${CRMEB_IMAGE:?}
    container_name: crmeb-workerman
    restart: unless-stopped
    command: ["workerman"]
    env_file:
      - ${CRMEB_CONFIG_DIR:?}/.env
    volumes:
      - ${CRMEB_CONFIG_DIR:?}/.env:/var/www/crmeb/.env:ro
      - ${CRMEB_CONFIG_DIR:?}/.constant:/var/www/crmeb/.constant
      - ${CRMEB_DATA_DIR:?}/uploads:/var/www/crmeb/public/uploads
      - ${CRMEB_DATA_DIR:?}/runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - server-internal-net
    logging:
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: ${CRMEB_IMAGE:?}
    container_name: crmeb
    restart: unless-stopped
    command: ["nginx"]
    volumes:
      - ${CRMEB_DATA_DIR:?}/uploads:/var/www/crmeb/public/uploads:ro
      - ${CRMEB_DATA_DIR:?}/assets-cache:/var/cache/crmeb/assets
    depends_on:
      php:
        condition: service_healthy
      workerman:
        condition: service_started
    networks:
      - server-internal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options: {max-size: "10m", max-file: "3"}
    labels:
      - traefik.enable=true
      - traefik.docker.network=server-internal-net
      - traefik.http.routers.crmeb-http.rule=Host(`${CRMEB_HOST:?}`)
      - traefik.http.routers.crmeb-http.entrypoints=web
      - traefik.http.routers.crmeb-https.rule=Host(`${CRMEB_HOST:?}`)
      - traefik.http.routers.crmeb-https.entrypoints=websecure
      - traefik.http.routers.crmeb-https.tls=true
      - traefik.http.routers.crmeb-https.tls.certresolver=myresolver
      - traefik.http.services.crmeb.loadbalancer.server.port=80

networks:
  server-internal-net:
    external: true
