server {
    listen 80;
    server_name _;
    root /var/www/crmeb/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100M;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/crmeb/ready.php;
        fastcgi_pass php:9000;
        add_header Cache-Control "no-store" always;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* ^/(admin|pages)/.*\.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.php?s=$uri&$args;
    }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location /notice {
        proxy_pass http://workerman:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /msg { return 404; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_param HTTP_ACCEPT_ENCODING "";
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
    }

    location ~* "\.[a-f0-9]{8,}\.(js|css|woff2?|ttf|svg|jpe?g|png|webp)$" {
        try_files $uri @previous_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|gif|jpe?g|png|bmp|webp|swf|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    location @previous_asset {
        internal;
        root /var/cache/crmeb/assets;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
