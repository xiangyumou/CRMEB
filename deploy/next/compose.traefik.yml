# The overlay that puts the edge behind Traefik. **Never** applied by
# `upgrade.sh`, `rollback.sh` or a routine `up`; applying it is a deliberate
# step, and so is taking it away (README.md, "The Traefik overlay").
#
#   docker compose -p crmeb-next --env-file deployment.env \
#     -f compose.yml -f compose.traefik.yml up -d --wait
#
# Why a second file rather than `traefik.enable=${NEXT_TRAEFIK:-false}` on the
# service:
#
#   - a label that says `false` still puts the container in front of the
#     provider, and one mistyped value in an env file flips it;
#   - `server-internal-net` is where Traefik reaches a backend. A service that
#     is not on that network cannot be routed to *whatever* its labels claim,
#     and an external network cannot be made conditional inside one file.
#
# So without this file the stack is not merely unlabelled — it is not
# reachable from the router at all. Bringing it up for a smoke test on
# loopback can therefore never take the domain.

services:
  edge:
    environment:
      # Traefik's network, so the edge takes the client address from the
      # X-Forwarded-For Traefik appends — and from nobody else.
      # Required: without it every shopper is Traefik's one address, and the
      # per-IP SMS budget (50 codes a day by default) locks the whole shop
      # out of SMS sign-in by lunchtime. README.md, "The client's address".
      NEXT_EDGE_TRUSTED_PROXIES: ${NEXT_EDGE_TRUSTED_PROXIES:?set NEXT_EDGE_TRUSTED_PROXIES to server-internal-net's subnet before switching traffic}
    networks:
      - default
      - server-internal-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=server-internal-net
      - traefik.http.routers.crmeb-next-http.rule=Host(`${NEXT_HOST:?set NEXT_HOST before switching traffic}`)
      - traefik.http.routers.crmeb-next-http.entrypoints=web
      - traefik.http.routers.crmeb-next-https.rule=Host(`${NEXT_HOST:?}`)
      - traefik.http.routers.crmeb-next-https.entrypoints=websecure
      - traefik.http.routers.crmeb-next-https.tls=true
      - traefik.http.routers.crmeb-next-https.tls.certresolver=myresolver
      - traefik.http.services.crmeb-next.loadbalancer.server.port=80

networks:
  server-internal-net:
    external: true
