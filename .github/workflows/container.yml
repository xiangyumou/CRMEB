name: Container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xiangyumou/crmeb

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-input
          path: .build/release

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          cache-from: type=gha,scope=validate-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.slug }}
          build-args: VCS_REF=${{ github.sha }}

      - name: Verify image
        run: sh docker/verify-image.sh crmeb-ci:${{ matrix.slug }}-${{ github.sha }}

      - name: Save tested image
        run: docker save crmeb-ci:${{ matrix.slug }}-${{ github.sha }} -o /tmp/crmeb-${{ matrix.slug }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.slug }}
          path: /tmp/crmeb-${{ matrix.slug }}.tar
          retention-days: 1
          compression-level: 0

      - name: Scan image
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        if: matrix.platform == 'linux/amd64' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  regression:
    name: Core transaction regression
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: tested-image-amd64
          path: /tmp/tested-images
      - name: Load validated image
        run: docker load -i /tmp/tested-images/crmeb-amd64.tar

      - name: Run regression suite
        run: sh docker/run-regression.sh crmeb-ci:amd64-${{ github.sha }}

      - name: Upload regression report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-regression-report
          path: tests/regression/artifacts/junit.xml
          if-no-files-found: error
          retention-days: 14

  http_stack:
    name: HTTP stack ${{ matrix.platform }}
    needs: [validate, regression]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tested-image-${{ matrix.slug }}
          path: /tmp/tested-images
      - name: Verify complete HTTP stack
        run: |
          docker load -i /tmp/tested-images/crmeb-${{ matrix.slug }}.tar
          sh docker/verify-http-stack.sh crmeb-ci:${{ matrix.slug }}-${{ github.sha }}

  frontend:
    name: Frontend source and admin build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: template/admin/package-lock.json
      - name: Install admin dependencies
        run: npm ci --prefix template/admin --no-audit --no-fund
      - name: Lint maintained editor files without rewriting
        run: npm run lint:check --prefix template/admin -- src/utils/diyRegistry.js src/pages/setting/devise/diyIndex.vue
      - name: Validate H5 and MP-WEIXIN source
        run: node tests/static/core-store-front.cjs
      - name: Validate release manifest checker
        run: node tests/static/verify-release-test.cjs
      - name: Validate WeChat payment adapters
        run: node tests/static/wechat-payment-test.mjs
      - name: Build complete release
        run: bash scripts/build-release.sh
      - name: Package deployment configuration
        run: |
          tar -czf .build/release/deployment-config.tar.gz \
            compose.yaml deploy/production/compose.yml deploy/production/nginx.conf \
            deploy/production/normalize.sh deploy/production/rollback.sh \
            deploy/production/migrate-all-in-one.sh docker/cache-assets.sh
      - name: Upload paired frontend and image inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-input
          path: .build/release/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: mp-weixin-test-${{ github.sha }}
          path: .build/release/mpWeixin/
          retention-days: 90

  publish:
    name: Publish multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - validate
      - regression
      - http_stack
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: /tmp/tested-images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-input
          path: .build/release
      - name: Publish tested architecture images and digest
        shell: bash
        run: |
          set -euo pipefail
          for tag in "sha-$GITHUB_SHA" "sha-$GITHUB_SHA-amd64" "sha-$GITHUB_SHA-arm64"; do
            if docker manifest inspect "$IMAGE_NAME:$tag" >/dev/null 2>&1; then
              echo "Immutable image tag already exists: $tag" >&2
              exit 1
            fi
          done
          for arch in amd64 arm64; do
            docker load -i "/tmp/tested-images/crmeb-$arch.tar"
            docker tag "crmeb-ci:$arch-$GITHUB_SHA" "$IMAGE_NAME:sha-$GITHUB_SHA-$arch"
            docker push "$IMAGE_NAME:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE_NAME:sha-$GITHUB_SHA" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-amd64" "$IMAGE_NAME:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" > /tmp/image-inspect.txt
          digest="$(awk '/^Digest:/ {print $2; exit}' /tmp/image-inspect.txt)"
          test -n "$digest"
          node scripts/finalize-release.cjs "$IMAGE_NAME@$digest" ".build/release/release.json"
          node scripts/verify-release.cjs ".build/release/release.json"
      - name: Promote current master to edge
        shell: bash
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$head" = "$GITHUB_SHA" || { echo 'A newer master commit exists; edge unchanged'; exit 0; }
          docker buildx imagetools create -t "$IMAGE_NAME:edge" "$IMAGE_NAME:sha-$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ github.sha }}
          path: .build/release/release.json
          retention-days: 90
