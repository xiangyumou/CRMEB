name: Container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xiangyumou/crmeb
  RELEASE_NAME: ghcr.io/xiangyumou/crmeb-release
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve release inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RELEASE_NAME:input-$GITHUB_SHA"
          container="$(docker create "$RELEASE_NAME:input-$GITHUB_SHA" /)"
          mkdir -p .build/release
          docker cp "$container:/release/." .build/release
          docker rm "$container"

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}

      - name: Verify image
        run: sh docker/verify-image.sh crmeb-ci:${{ matrix.slug }}-${{ github.sha }}

      - name: Stage verified architecture image
        run: |
          docker tag crmeb-ci:${{ matrix.slug }}-${{ github.sha }} "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"
          docker push "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"

      - name: Scan image
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        if: matrix.platform == 'linux/amd64' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  regression:
    name: Core transaction regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrieve verified image
        run: docker pull "$IMAGE_NAME:ci-${{ github.sha }}-amd64"

      - name: Run regression suite
        run: sh docker/run-regression.sh "$IMAGE_NAME:ci-${{ github.sha }}-amd64"

  http_stack:
    name: HTTP stack ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate, regression]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify complete HTTP stack
        run: |
          docker pull "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"
          sh docker/verify-http-stack.sh "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"

  frontend:
    name: Frontend source and admin build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: template/admin/package-lock.json
      - name: Install admin dependencies
        run: npm ci --prefix template/admin --no-audit --no-fund
      - name: Lint maintained editor files without rewriting
        run: npm run lint:check --prefix template/admin -- src/utils/diyRegistry.js src/pages/setting/devise/diyIndex.vue
      - name: Validate H5 and MP-WEIXIN source
        run: node tests/static/core-store-front.cjs
      - name: Validate release manifest checker
        run: node tests/static/verify-release-test.cjs
      - name: Validate WeChat payment adapters
        run: node tests/static/wechat-payment-test.mjs
      - name: Build complete release
        run: bash scripts/build-release.sh
      - name: Package deployment configuration
        run: |
          tar -czf .build/release/deployment-config.tar.gz \
            compose.yaml deploy/production/compose.yml deploy/production/nginx.conf \
            deploy/production/normalize.sh deploy/production/rollback.sh \
            deploy/production/migrate-all-in-one.sh docker/cache-assets.sh
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage all frontend inputs
        run: |
          docker build -f docker/release.Dockerfile -t "$RELEASE_NAME:input-$GITHUB_SHA" .build/release
          docker push "$RELEASE_NAME:input-$GITHUB_SHA"

  pr_check:
    name: Pull request ${{ matrix.platform }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Check source and build all frontends
        run: |
          npm ci --prefix template/admin --no-audit --no-fund
          npm run lint:check --prefix template/admin -- src/utils/diyRegistry.js src/pages/setting/devise/diyIndex.vue
          node tests/static/core-store-front.cjs
          node tests/static/verify-release-test.cjs
          node tests/static/wechat-payment-test.mjs
          bash scripts/build-release.sh
      - name: Build and validate image
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t crmeb-pr:${{ matrix.slug }} .
          sh docker/verify-image.sh crmeb-pr:${{ matrix.slug }}
      - name: Test transaction regression
        if: matrix.slug == 'amd64'
        run: sh docker/run-regression.sh crmeb-pr:${{ matrix.slug }}
      - name: Verify HTTP stack
        run: sh docker/verify-http-stack.sh crmeb-pr:${{ matrix.slug }}

  publish:
    name: Publish multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - validate
      - regression
      - http_stack
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve release inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RELEASE_NAME:input-$GITHUB_SHA"
          container="$(docker create "$RELEASE_NAME:input-$GITHUB_SHA" /)"
          mkdir -p .build/release
          docker cp "$container:/release/." .build/release
          docker rm "$container"
      - name: Publish tested architecture images and digest
        shell: bash
        run: |
          set -euo pipefail
          for tag in "sha-$GITHUB_SHA" "sha-$GITHUB_SHA-amd64" "sha-$GITHUB_SHA-arm64"; do
            if docker manifest inspect "$IMAGE_NAME:$tag" >/dev/null 2>&1; then
              echo "Immutable image tag already exists: $tag" >&2
              exit 1
            fi
          done
          for arch in amd64 arm64; do
            docker buildx imagetools create -t "$IMAGE_NAME:sha-$GITHUB_SHA-$arch" \
              "$IMAGE_NAME:ci-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE_NAME:sha-$GITHUB_SHA" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-amd64" "$IMAGE_NAME:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" > /tmp/image-inspect.txt
          digest="$(awk '/^Digest:/ {print $2; exit}' /tmp/image-inspect.txt)"
          test -n "$digest"
          node scripts/finalize-release.cjs "$IMAGE_NAME@$digest" ".build/release/release.json"
          node scripts/verify-release.cjs ".build/release/release.json"
          docker build -f docker/release.Dockerfile -t "$RELEASE_NAME:sha-$GITHUB_SHA" .build/release
          docker push "$RELEASE_NAME:sha-$GITHUB_SHA"
      - name: Preserve release record and frontend packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tar -C .build/release -czf /tmp/admin.tar.gz admin
          tar -C .build/release -czf /tmp/h5.tar.gz h5
          if [ "$(jq -r '.mpWeixin.publishable' .build/release/build.json)" = true ]; then
            mp_package="/tmp/mp-weixin-$GITHUB_SHA.tar.gz"
          else
            mp_package="/tmp/mp-weixin-test-$GITHUB_SHA.tar.gz"
          fi
          tar -C .build/release -czf "$mp_package" mpWeixin
          gh release create "sha-$GITHUB_SHA" \
            .build/release/release.json \
            .build/release/deployment-config.tar.gz \
            /tmp/admin.tar.gz /tmp/h5.tar.gz "$mp_package" \
            --target "$GITHUB_SHA" --title "CRMEB sha-$GITHUB_SHA" \
            --notes "Tested amd64/arm64 application release. The image digest is in release.json." \
            --latest=false
      - name: Promote current master to edge
        shell: bash
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$head" = "$GITHUB_SHA" || { echo 'A newer master commit exists; edge unchanged'; exit 0; }
          docker buildx imagetools create -t "$IMAGE_NAME:edge" "$IMAGE_NAME:sha-$GITHUB_SHA"
