name: Container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # Publishing is serialized across the repository, not only per ref: two refs
  # reaching the publish job at once could otherwise interleave their tag
  # updates (a release tag and the deployment tag it points at must move
  # together). `cancel-in-progress` stays false: a release is never cancelled
  # mid-publish.
  group: container-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xiangyumou/crmeb
  RELEASE_NAME: ghcr.io/xiangyumou/crmeb-release
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve release inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RELEASE_NAME:input-$GITHUB_SHA"
          container="$(docker create "$RELEASE_NAME:input-$GITHUB_SHA" /)"
          mkdir -p .build/release
          docker cp "$container:/release/." .build/release
          docker rm "$container"

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}

      - name: Verify image
        run: sh docker/verify-image.sh crmeb-ci:${{ matrix.slug }}-${{ github.sha }}

      - name: Stage verified architecture image
        run: |
          docker tag crmeb-ci:${{ matrix.slug }}-${{ github.sha }} "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"
          docker push "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"

      - name: Scan image
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crmeb-ci:${{ matrix.slug }}-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        if: matrix.platform == 'linux/amd64' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  regression:
    name: Core transaction regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    # 门禁现在还包含 phpstan 与定向变异检查；后者要自建一次性镜像并逐条跑 18 项保护，
    # 原来的 10 分钟不够。
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrieve verified image
        run: docker pull "$IMAGE_NAME:ci-${{ github.sha }}-amd64"

      # The gate now also runs tests/deployment/mutation-check.sh, which reads
      # .build/release/build.json to decide which revision to build its own
      # throwaway image from. Without the release inputs that file is absent and
      # the mutation step cannot start.
      - name: Retrieve release inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RELEASE_NAME:input-$GITHUB_SHA"
          container="$(docker create "$RELEASE_NAME:input-$GITHUB_SHA" /)"
          mkdir -p .build/release
          docker cp "$container:/release/." .build/release
          docker rm "$container"

      - name: Run regression suite
        run: sh scripts/check-maintenance.sh "$IMAGE_NAME:ci-${{ github.sha }}-amd64"

  http_stack:
    name: HTTP stack ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate, regression]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify complete HTTP stack
        run: |
          docker pull "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"
          sh docker/verify-http-stack.sh "$IMAGE_NAME:ci-${{ github.sha }}-${{ matrix.slug }}"

  frontend:
    name: Frontend source and admin build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: template/admin/package-lock.json
      - name: Install admin dependencies
        run: npm ci --prefix template/admin --no-audit --no-fund
      - name: Lint maintained editor files without rewriting
        run: npm run lint:check --prefix template/admin -- src/utils/diyRegistry.js src/pages/setting/devise/diyIndex.vue
      - name: Validate H5 and MP-WEIXIN source
        run: node tests/static/core-store-front.cjs
      - name: Validate release manifest checker
        run: node tests/static/verify-release-test.cjs
      - name: Validate WeChat payment adapters
        run: node tests/static/wechat-payment-test.mjs
      - name: Build complete release
        run: bash scripts/build-release.sh
      - name: Package deployment configuration
        run: |
          # Fixed archive metadata keeps this asset byte-identical when the same
          # commit is published twice, so publish can verify a resumed run.
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -czf .build/release/deployment-config.tar.gz \
            compose.yaml deploy/production/compose.yml deploy/production/nginx.conf \
            deploy/production/normalize.sh deploy/production/rollback.sh deploy/production/upgrade.sh \
            deploy/production/migrate-all-in-one.sh docker/cache-assets.sh
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage all frontend inputs
        run: |
          docker build -f docker/release.Dockerfile -t "$RELEASE_NAME:input-$GITHUB_SHA" .build/release
          docker push "$RELEASE_NAME:input-$GITHUB_SHA"

  pr_check:
    name: Pull request ${{ matrix.platform }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Check source and build all frontends
        run: |
          npm ci --prefix template/admin --no-audit --no-fund
          npm run lint:check --prefix template/admin -- src/utils/diyRegistry.js src/pages/setting/devise/diyIndex.vue
          node tests/static/core-store-front.cjs
          node tests/static/verify-release-test.cjs
          node tests/static/wechat-payment-test.mjs
          bash scripts/build-release.sh
      - name: Build and validate image
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t crmeb-pr:${{ matrix.slug }} .
          sh docker/verify-image.sh crmeb-pr:${{ matrix.slug }}
      - name: Test transaction regression
        if: matrix.slug == 'amd64'
        run: sh scripts/check-maintenance.sh crmeb-pr:${{ matrix.slug }}
      - name: Verify HTTP stack
        run: sh docker/verify-http-stack.sh crmeb-pr:${{ matrix.slug }}

  publish:
    name: Publish multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - validate
      - regression
      - http_stack
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve release inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RELEASE_NAME:input-$GITHUB_SHA"
          container="$(docker create "$RELEASE_NAME:input-$GITHUB_SHA" /)"
          mkdir -p .build/release
          docker cp "$container:/release/." .build/release
          docker rm "$container"
      - name: Publish tested architecture images and digest
        shell: bash
        run: |
          set -euo pipefail
          # The publish rules live in scripts/publish-release.sh (verified against
          # a real registry by tests/deployment/publish-release.sh), not inline
          # here, so they can be exercised instead of read.
          arch_images=()
          for arch in amd64 arm64; do
            arch_images+=("$IMAGE_NAME:ci-$GITHUB_SHA-$arch")
          done
          digest="$(bash scripts/publish-release.sh tags "$IMAGE_NAME" "$GITHUB_SHA" "${arch_images[@]}" | tail -1)"
          test -n "$digest"
          node scripts/finalize-release.cjs "$IMAGE_NAME@$digest" ".build/release/release.json"
          node scripts/verify-release.cjs ".build/release/release.json"
          docker build -f docker/release.Dockerfile -t "$RELEASE_NAME:sha-$GITHUB_SHA" .build/release
          bash scripts/publish-release.sh release-image "$RELEASE_NAME" "sha-$GITHUB_SHA" "$RELEASE_NAME:sha-$GITHUB_SHA"
      - name: Preserve release record and frontend packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="sha-$GITHUB_SHA"
          # Fixed archive metadata keeps the packages byte-identical when the same
          # commit is published twice, so a resumed run can verify them, and the
          # script compares every asset by content before accepting it.
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C .build/release -czf /tmp/admin.tar.gz admin
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C .build/release -czf /tmp/h5.tar.gz h5
          if [ "$(jq -r '.mpWeixin.publishable' .build/release/build.json)" = true ]; then
            mp_package="/tmp/mp-weixin-$GITHUB_SHA.tar.gz"
          else
            mp_package="/tmp/mp-weixin-test-$GITHUB_SHA.tar.gz"
          fi
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C .build/release -czf "$mp_package" mpWeixin
          bash scripts/publish-release.sh assets "$release_tag" \
            .build/release/release.json \
            .build/release/deployment-config.tar.gz \
            /tmp/admin.tar.gz \
            /tmp/h5.tar.gz \
            "$mp_package"
      - name: Candidate ready for manual promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          # This workflow only publishes the immutable candidate. The deployment
          # tag moves through the separate manual Promote workflow, which requires
          # the candidate digest, the source commit and an acceptance record — so
          # nothing reaches a deployed tag without a human sign-off, and no image
          # is ever rebuilt for a promotion.
          echo "Candidate sha-$GITHUB_SHA is published; run the Promote workflow to move the deployment tag."
