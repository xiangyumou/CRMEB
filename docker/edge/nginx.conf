# The `edge` server block: static H5, the shared uploads volume, and a proxy to
# the Next standalone server.
#
# Three surfaces behind one port:
#   /                the uni-app H5 build, a history-mode SPA
#   /admin, /admin-api, /api, /scan-upload    the `web` container
#   /uploads/        the shared volume, as inert bytes

# `resolve`: the address of `web` is looked up again every two seconds through
# Docker's DNS, not once at start. A release that stops nothing recreates `web`
# beside a running edge, and the new container comes up on a new address; an
# edge that had resolved the name once would keep proxying to the old one.
upstream web {
    zone web 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server web:3000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# An upload opens in the browser only if it is an image or a
# video — what the storefront and admin embed. Anything else (a PDF, an office
# file, audio, bytes nginx cannot type) is a download, so following a link to
# it never renders a document on the shop's own origin. `<img>`, `<video>` and
# `<audio>` ignore the header, so embedding is unaffected. Keyed on the type
# nginx derives from the extension, which is the one it sends. SVG is denied
# outright below; it is listed here as well so that relaxing that deny does not
# make it inline.
map $sent_http_content_type $uploads_disposition {
    default           attachment;
    ~*^image/svg      attachment;
    ~*^image/         inline;
    ~*^video/         inline;
}

server {
    listen 80;
    server_name _;
    root /srv/h5;
    index index.html;
    charset utf-8;

    # Matches the application's own upload ceiling. Nginx answers 413 before a
    # byte reaches the app, so the two limits have to agree or the larger one
    # is a lie. Keep in step with `NEXT_MAX_UPLOAD_SIZE` in compose.yml.
    client_max_body_size 100M;

    server_tokens off;

    # --- the client address -------------------------------------------------
    #
    # The trust boundary for "who is calling". `X-Forwarded-For` is honoured
    # only from the front proxy's own network — the list
    # `40-edge-real-ip.sh` writes from NEXT_EDGE_TRUSTED_PROXIES at start —
    # and, with `real_ip_recursive`, the address used is the right-most one
    # that is not a trusted proxy: the peer the front proxy itself saw. A
    # client's own `X-Forwarded-For: 198.51.100.7` is only ever to the left of
    # that, so it is never picked. From any other peer the header is ignored
    # and `$remote_addr` stays the TCP peer.
    #
    # Upstream, the edge then *overwrites* both headers with that one address
    # (see the proxy locations): the app reads `X-Real-IP` and nothing else
    # (`apps/web/src/server/request-meta.ts`).
    include /etc/nginx/edge/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # The uploads location re-states these; `add_header` does not inherit into
    # a block that sets one of its own.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- probes -------------------------------------------------------------

    # Liveness of the edge itself. Deliberately answered by nginx: it must not
    # depend on the app, or a slow app would take the edge's own probe down
    # with it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness of what is behind the edge: the deep check — database, Redis,
    # the schema and the worker heartbeat — answered by the app itself and 503
    # when any of them is down (`apps/web/src/server/health.ts`).
    #
    # Nothing restarts a container on this answer. The container healthchecks
    # call `/api/v1/health`, which touches nothing; `deploy/lib/readiness.sh`
    # reads this endpoint as the gate on a *release* and keeps its own direct
    # queries as a second opinion.
    location = /readyz {
        proxy_pass http://web/api/v1/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # --- the application ----------------------------------------------------

    # Server-sent events. Buffering an SSE stream holds every event until the
    # buffer fills, which looks exactly like "notifications stopped working";
    # the long read timeout keeps nginx from cutting an idle stream.
    location = /admin-api/notifications/stream {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: `$remote_addr` is the
        # realip result above, and the client's own header goes no further.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Every Next route needs its prefix here, or a location of its own: a
    # path nothing above matches falls through to the storefront's
    # history-mode fallback and is answered with its `index.html`, not a 404.
    # `/scan-upload/<token>` is the page the admin's 扫码上传 QR code opens on
    # a phone. `deploy/rehearsal/drill.sh::edge/proxies-every-page-route`
    # requests every page route through this server and fails on one it does
    # not proxy.
    location ~ ^/(admin|admin-api|api|scan-upload)(/|$) {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: `$remote_addr` is the
        # realip result above, and the client's own header goes no further.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Next's own build assets are immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # --- uploads ------------------------------------------------------------

    # Static bytes, never code. `^~` wins over every regex location below, so
    # the dotfile deny and the nosniff header are restated here rather than
    # inherited: a nested `^~` location silently drops them otherwise.
    #
    # The uploader sniffs content and refuses scripts, HTML and SVG
    # (STOR-001), so this is defence in depth rather than the only guard. It
    # stays because depth is the point.
    #
    # These bytes share the shop's origin — a deliberate, written-down choice
    # (`deploy/README.md` § "Where uploads are served
    # from"); the three headers below are what makes that tolerable.
    location ^~ /uploads/ {
        alias /data/uploads/;

        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(ph(p[3457]?|t|tml|ar)|jsp?|aspx?|cgi|pl|py|sh|so|exe|html?|xhtml|svgz?)$ { deny all; }

        # Known media types keep their real type; everything else is bytes, not
        # a guess. The `^~` prefix means nothing here is inherited, so the
        # header set is written out in full rather than assumed.
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        # An image served as `text/html` because a browser guessed is a stored
        # XSS on our own origin.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition $uploads_disposition always;
        add_header Cache-Control "public, max-age=604800" always;

        try_files $uri =404;
        access_log off;
    }

    # --- the H5 storefront --------------------------------------------------

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* "\.[a-f0-9]{8,}\.(js|css|woff2?|ttf|svg|jpe?g|png|webp)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # History-mode fallback, last so every rule above wins over it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
    }
}
