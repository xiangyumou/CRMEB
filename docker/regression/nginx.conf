server {
    listen 80;
    server_name _;
    root /var/www/crmeb/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    # 上传目录只当静态文件伺服。扩展名白名单（config/upload.php）目前是唯一挡在
    # "上传"与"代码执行"之间的东西，没有任何纵深防御；`^~` 让这个前缀优先于下面的
    # 正则 location，嵌套的 deny 再把可执行后缀挡死，所以即使有文件绕过白名单落到
    # 这里，也不会被 PHP 解释。
    location ^~ /uploads/ {
        # 与 deploy/production/nginx.conf 保持一致：`^~` 会跳过全部正则 location，
        # 所以点文件拒绝要在这里重写一遍。
        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(ph(p[3457]?|t|tml|ar))$ { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/crmeb/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 10s;
    }
}
