name: crmeb-regression

services:
  mysql:
    image: mysql:8.0.42
    environment:
      MYSQL_DATABASE: crmeb_regression
      MYSQL_ROOT_PASSWORD: regression
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=ONLY_FULL_GROUP_BY,NO_ENGINE_SUBSTITUTION
    volumes:
      - ./mysql-client.cnf:/etc/mysql/conf.d/utf8-client.cnf:ro
      - ../../crmeb/public/install/crmeb.sql:/docker-entrypoint-initdb.d/001-crmeb.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pregression", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:5.0.14-bullseye
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  php-fpm:
    image: ${CRMEB_TEST_IMAGE:?}
    command: ["php"]
    environment:
      APP_DEBUG: "false"
    volumes:
      - ./test.env:/var/www/crmeb/.env:ro
      - ./test.constant:/var/www/crmeb/.constant:ro
      - uploads:/var/www/crmeb/public/uploads
      - runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases: [php]

  # 真实的长连接容器：Channel 服务监听在这里，php、nginx 通过服务名连它。
  # php-fpm 不再冒充 workerman，拓扑与生产 compose 保持一致。
  workerman:
    image: ${CRMEB_TEST_IMAGE:?}
    command: ["workerman"]
    environment:
      APP_DEBUG: "false"
    volumes:
      - ./test.env:/var/www/crmeb/.env:ro
      - ./test.constant:/var/www/crmeb/.constant:ro
      - uploads:/var/www/crmeb/public/uploads
      - runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/opt/crmeb/healthcheck.php", "workerman"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  nginx:
    image: ${CRMEB_TEST_IMAGE:?}
    command: ["nginx"]
    volumes:
      - ./test.env:/var/www/crmeb/.env:ro
      - uploads:/var/www/crmeb/public/uploads:ro
      - assets-cache:/var/cache/crmeb/assets
    depends_on:
      php-fpm:
        condition: service_started
      # nginx.conf proxies /notice to http://workerman:40001 and resolves that
      # name while loading its configuration; without this dependency the
      # container exits on startup with "host not found in upstream".
      workerman:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/readyz | grep -q 'true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  regression:
    build:
      context: ../..
      target: vendor
    working_dir: /build/crmeb
    environment:
      CRMEB_ROOT: /build/crmeb
      REGRESSION_HTTP_BASE_URL: http://nginx
    volumes:
      - ../../tests/regression:/tests/regression
      - ./test.env:/build/crmeb/.env:ro
      - ./install.lock:/build/crmeb/public/install.lock:ro
      # 与 nginx/php-fpm 共享上传目录：UploadExecutionTest 需要把文件放进 nginx
      # 真正伺服的那个目录，才能证明上传的 PHP 不会被执行。
      #
      # 刻意挂在 /uploads，而不是 /build/crmeb/public/uploads：卷为空时 Docker 会用
      # 先挂载它的那个镜像的目录内容去填充，并连属主一起套上。regression 镜像里
      # 那个路径是 root 属主且有遗留内容，于是会把运行时镜像留下的 www-data 属主
      # 覆盖掉，php-fpm 之后就再也建不了子目录（拼团海报因此 mkdir 失败）。
      # 挂在一个 regression 镜像里不存在的路径上，就不会触发这次填充。
      - uploads:/uploads
    command: ["php", "/tests/regression/vendor/bin/phpunit", "--configuration", "/tests/regression/phpunit.xml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_healthy

networks:
  default:
    internal: true

volumes:
  mysql-data:
  redis-data:
  uploads:
  runtime:
  assets-cache:
