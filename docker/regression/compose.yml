name: crmeb-regression

services:
  mysql:
    image: mysql:8.0.42
    environment:
      MYSQL_DATABASE: crmeb_regression
      MYSQL_ROOT_PASSWORD: regression
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=ONLY_FULL_GROUP_BY,NO_ENGINE_SUBSTITUTION
    volumes:
      - ../../crmeb/public/install/crmeb.sql:/docker-entrypoint-initdb.d/001-crmeb.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pregression", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:5.0.14-bullseye
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  php-fpm:
    image: ${CRMEB_TEST_IMAGE:?}
    command: ["php"]
    environment:
      APP_DEBUG: "false"
    volumes:
      - ./test.env:/var/www/crmeb/.env:ro
      - ./test.constant:/var/www/crmeb/.constant:ro
      - uploads:/var/www/crmeb/public/uploads
      - runtime:/var/www/crmeb/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases: [php, workerman]

  nginx:
    image: ${CRMEB_TEST_IMAGE:?}
    command: ["nginx"]
    volumes:
      - ./test.env:/var/www/crmeb/.env:ro
      - uploads:/var/www/crmeb/public/uploads:ro
      - assets-cache:/var/cache/crmeb/assets
    depends_on:
      - php-fpm
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/readyz | grep -q 'true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  regression:
    build:
      context: ../..
      target: vendor
    working_dir: /build/crmeb
    environment:
      CRMEB_ROOT: /build/crmeb
      REGRESSION_HTTP_BASE_URL: http://nginx
    volumes:
      - ../../tests/regression:/tests/regression
      - ./test.env:/build/crmeb/.env:ro
      - ./install.lock:/build/crmeb/public/install.lock:ro
    command: ["php", "/tests/regression/vendor/bin/phpunit", "--configuration", "/tests/regression/phpunit.xml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_healthy

networks:
  default:
    internal: true

volumes:
  mysql-data:
  redis-data:
  uploads:
  runtime:
  assets-cache:
