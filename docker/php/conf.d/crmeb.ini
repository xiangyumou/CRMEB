expose_php=Off
memory_limit=512M
upload_max_filesize=100M
post_max_size=100M
max_execution_time=60
max_input_vars=3000
date.timezone=Asia/Shanghai
opcache.enable=1
opcache.validate_timestamps=0
; 官方 php:7.4-fpm 镜像不安装 php.ini（只带 php.ini-production/-development），
; 缺省的 display_errors 是开的，异常处理器装上之前的告警和致命错误会直接进响应体、
; 泄露路径。上线时已经踩过同类问题（[DATABASE] DEBUG=true 让未认证请求拿到数据库
; 报错原文），这里显式钉死。
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2
